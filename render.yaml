services:
  - type: web
    name: aurapass
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATA_DIR
        value: /var/data
    disk:
      name: aurapass-data
      mountPath: /var/data
      sizeGB: 1
