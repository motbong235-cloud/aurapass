<!doctype html>
<html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AuraPass — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0F1A;--surface:#141A2B;--s2:#1C2540;--ink:#F2F5FF;--muted:#8E9ABB;--line:#26304D;--pri:#7C5CFF;--pri2:#3B82F6;--acc:#FFC24D;--ok:#2DD4A0;--bad:#FF6B81;--brand:linear-gradient(135deg,#7C5CFF,#3B82F6)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Kantumruy Pro",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 16px;font-weight:700}.logo{width:36px;height:36px;border-radius:12px;background:var(--brand);display:grid;place-items:center}
aside a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:var(--muted);text-decoration:none;cursor:pointer}aside a.on{background:var(--s2);color:#B7A6FF}aside a .n{margin-left:auto;background:var(--acc);color:#1A1300;font-size:11px;font-weight:700;border-radius:999px;padding:0 8px}
main{padding:24px 28px;max-width:1200px;width:100%}
h1{margin:0 0 18px;font-size:22px}h3{margin:0 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpi b{font-size:26px;display:block}.muted{color:var(--muted)}.sm{font-size:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}th{color:var(--muted);font-weight:500;font-size:12px}
.btn{background:var(--brand);color:#fff;font-weight:600;padding:9px 16px;border-radius:12px}.btn.g{background:var(--s2);color:#B7A6FF}.btn.r{background:rgba(255,107,129,.15);color:var(--bad)}.btn.s{padding:5px 11px;font-size:12px;border-radius:10px}
input,select,textarea{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;width:100%;outline:0}textarea{min-height:90px;resize:vertical;font-family:ui-monospace,monospace;font-size:13px}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.pill{display:inline-block;padding:1px 10px;border-radius:999px;font-size:11px;font-weight:600;background:var(--s2)}.ok{color:var(--ok)}.warn{color:var(--acc)}.bad{color:var(--bad)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:50;padding:16px}.modal>div{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;width:min(640px,100%);max-height:92vh;overflow:auto}
.login{min-height:100vh;display:grid;place-items:center}.login .card{width:min(360px,92vw)}
.toast{position:fixed;right:18px;top:18px;background:var(--s2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:99}
.tile{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
@media(max-width:800px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:8px}.brand{display:none}main{padding:16px}}
</style></head><body><div id="root"></div>
<script>
const $ = s => document.querySelector(s); const money = n => "$" + Number(n || 0).toFixed(2);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dt = t => t ? new Date(t).toLocaleString("en-GB", { dateStyle: "short", timeStyle: "short" }) : "—";
function toast(m) { const d = document.createElement("div"); d.className = "toast"; d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 2000); }
async function A(path, method = "GET", body) { const r = await fetch("/admin/api/" + path, { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined }); if (r.status === 401 && path !== "login") { loginView(); throw new Error("auth"); } const j = await r.json(); if (j.error) { toast(j.error); throw new Error(j.error); } return j; }
const PAGES = [["dash", "ផ្ទាំងគ្រប់គ្រង"], ["orders", "ការបញ្ជាទិញ"], ["pay", "ការទូទាត់"], ["products", "ផលិតផល"], ["stock", "ស្តុកគណនី"], ["users", "អ្នកប្រើ"], ["settings", "ការកំណត់"]];
let page = "dash", badge = 0;
function loginView() { $("#root").innerHTML = `<div class="login"><form class="card" onsubmit="return doLogin(event)"><h3>AuraPass Admin</h3><label>ពាក្យសម្ងាត់</label><input id="pw" type="password" autofocus><div style="height:14px"></div><button class="btn" style="width:100%">ចូល</button></form></div>`; }
async function doLogin(e) { e.preventDefault(); try { await A("login", "POST", { password: $("#pw").value }); shell(); } catch (x) {} return false; }
async function shell() {
  try { const st = await A("stats"); badge = st.pendingPay + st.processing; } catch (e) { return; }
  $("#root").innerHTML = `<div class="app"><aside><div class="brand"><div class="logo">A</div>AuraPass Admin</div>${PAGES.map(([k, l]) => `<a class="${k === page ? "on" : ""}" onclick="go('${k}')">${l}${k === "pay" && badge ? `<span class="n">${badge}</span>` : ""}</a>`).join("")}<div class="sp"></div><a onclick="out()">ចាកចេញ</a></aside><main id="main"></main></div>`;
  views[page]();
}
function go(p) { page = p; shell(); } async function out() { await A("logout", "POST"); loginView(); }
const views = {
  async dash() { const s = await A("stats"); $("#main").innerHTML = `<h1>ផ្ទាំងគ្រប់គ្រង</h1><div class="grid g4">${[["ចំណូលសរុប", money(s.revenue)], ["ចំណូល 24 ម៉ោង", money(s.revenue24)], ["ការបញ្ជាទិញ (24ម៉ោង)", s.orders24 + " / " + s.orders], ["អ្នកប្រើ", s.users], ["រង់ចាំដឹកជញ្ជូន", s.processing], ["រង់ចាំអនុម័តបង់ប្រាក់", s.pendingPay]].map(([a, b]) => `<div class="card kpi"><span class="muted sm">${a}</span><b>${b}</b></div>`).join("")}</div>
   <div class="grid g2" style="margin-top:14px"><div class="card"><h3>ស្តុកជិតអស់</h3>${s.lowStock.length ? s.lowStock.map(x => `<div class="row"><span class="sp">${esc(x.product)} · ${esc(x.plan)}</span><span class="pill ${x.left ? "warn" : "bad"}">${x.left} ក្នុងស្តុក</span></div>`).join("") : `<span class="muted">ស្តុកគ្រប់គ្រាន់</span>`}</div>
   <div class="card"><h3>ការបញ្ជាទិញថ្មីៗ</h3>${s.recent.map(o => `<div class="row"><span class="sp">${esc(o.pname)} ${esc(o.plan)}<br><span class="muted sm">${esc(o.uname)} · ${dt(o.at)}</span></span><b>${money(o.amount)}</b></div>`).join("") || `<span class="muted">មិនទាន់មាន</span>`}</div></div>`; },
  async orders() { const os = await A("orders"); $("#main").innerHTML = `<h1>ការបញ្ជាទិញ</h1><div class="card" style="overflow:auto"><table><tr><th>លេខ</th><th>អតិថិជន</th><th>ផលិតផល</th><th>តម្លៃ</th><th>ស្ថានភាព</th><th>ពេល</th><th></th></tr>${os.map(o => `<tr><td>${o.id}</td><td>${esc(o.uname)}<br><span class="muted sm">${o.uid}</span></td><td>${esc(o.pname)} · ${esc(o.plan)}<br><span class="muted sm">${esc(o.type)}</span></td><td>${money(o.amount)}<br><span class="muted sm">${o.how}</span></td><td><span class="pill ${o.status === "delivered" ? "ok" : o.status === "processing" ? "warn" : "bad"}">${o.status}</span></td><td class="sm">${dt(o.at)}</td><td>${o.status === "processing" ? `<button class="btn s" onclick="deliverModal('${o.id}')">ដឹកជញ្ជូន</button> ` : ""}${o.status !== "refunded" ? `<button class="btn s r" onclick="refund('${o.id}')">សង</button>` : ""}</td></tr>`).join("") || `<tr><td colspan=7 class="muted">មិនទាន់មាន</td></tr>`}</table></div>`; },
  async pay() { const ps = await A("payments"); $("#main").innerHTML = `<h1>ការទូទាត់ KHQR</h1><p class="muted">ផ្ទៀងផ្ទាំងលុយក្នុងកម្មវិធីធនាគាររបស់អ្នក រួចចុច «អនុម័ត» — ប្រព័ន្ធនឹងដឹកជញ្ជូនគណនី ឬបញ្ចូលលុយដោយស្វ័យប្រវត្តិ។</p><div class="card" style="overflow:auto"><table><tr><th>លេខ</th><th>អតិថិជន</th><th>ប្រភេទ</th><th>ចំនួន</th><th>ស្ថានភាព</th><th>ពេល</th><th></th></tr>${ps.map(x => `<tr><td>${x.id}</td><td>${esc(x.uname)}</td><td>${x.kind === "topup" ? "បញ្ចូលលុយ" : esc(x.product) + " · " + esc(x.plan)}</td><td><b>${money(x.amount)}</b></td><td><span class="pill ${x.status === "approved" ? "ok" : x.status === "pending" ? "warn" : "bad"}">${x.status}</span></td><td class="sm">${dt(x.at)}</td><td>${x.status === "pending" ? `<button class="btn s" onclick="payAct('${x.id}','approve')">អនុម័ត</button> <button class="btn s r" onclick="payAct('${x.id}','reject')">បដិសេធ</button>` : ""}</td></tr>`).join("") || `<tr><td colspan=7 class="muted">មិនទាន់មាន</td></tr>`}</table></div>`; },
  async products() { const ps = await A("products"); window._ps = ps; $("#main").innerHTML = `<div class="row"><h1 class="sp">ផលិតផល</h1><button class="btn" onclick="prodModal()">+ បន្ថែមផលិតផល</button></div><div class="card" style="overflow:auto"><table><tr><th></th><th>ឈ្មោះ</th><th>ចំណាត់ក្រុម</th><th>កញ្ចប់ និងតម្លៃ</th><th>ដឹកជញ្ជូន</th><th></th></tr>${ps.map(p => `<tr><td><div class="tile" style="background:linear-gradient(135deg,${p.c[0]},${p.c[1]})">${esc(p.letter)}</div></td><td><b>${esc(p.name)}</b> ${p.enabled ? "" : '<span class="pill bad">បិទ</span>'}</td><td>${esc(p.cat)}</td><td class="sm">${p.plans.map(x => `${esc(x.k)} ${money(x.p)} <span class="muted">(${p.stockByPlan[x.k]})</span>`).join("<br>")}</td><td>${p.delivery === "auto" ? "ស្វ័យប្រវត្តិ" : "ដោយដៃ"}</td><td><button class="btn s g" onclick="prodModal('${p.id}')">កែ</button> <button class="btn s r" onclick="delProd('${p.id}')">លុប</button></td></tr>`).join("")}</table></div>`; },
  async stock() { const ps = await A("products"); $("#main").innerHTML = `<h1>ស្តុកគណនី</h1><p class="muted">ដាក់មួយបន្ទាត់ក្នុងមួយគណនី (ឧ. <code>email:password</code>)។ គណនីនឹងដឹកជញ្ជូនតាមលំដាប់ដំបូង-ចេញដំបូង។</p><div class="grid g2">${ps.filter(p => p.delivery === "auto").map(p => `<div class="card"><div class="row"><div class="tile" style="background:linear-gradient(135deg,${p.c[0]},${p.c[1]})">${esc(p.letter)}</div><b class="sp">${esc(p.name)}</b></div>${p.plans.map((pl, i) => `<div class="row" style="margin-top:12px"><span class="sp">${esc(pl.k)} <span class="pill ${p.stockByPlan[pl.k] > 2 ? "ok" : "warn"}">${p.stockByPlan[pl.k]} ក្នុងស្តុក</span></span><button class="btn s" onclick="stockModal('${p.id}','${esc(pl.k)}')">+ បន្ថែម</button><button class="btn s g" onclick="stockView('${p.id}','${esc(pl.k)}')">មើល</button></div>`).join("")}</div>`).join("")}</div>`; },
  async users() { const us = await A("users"); $("#main").innerHTML = `<h1>អ្នកប្រើ</h1><div class="card" style="overflow:auto"><table><tr><th>ID</th><th>ឈ្មោះ</th><th>សមតុល្យ</th><th>ចូលរួម</th><th></th></tr>${us.map(u => `<tr><td>${u.id}</td><td>${esc(u.name)} <span class="muted sm">${u.username ? "@" + esc(u.username) : ""}</span></td><td><b>${money(u.balance)}</b></td><td class="sm">${dt(u.joined)}</td><td><button class="btn s g" onclick="balModal(${u.id})">កែសមតុល្យ</button></td></tr>`).join("") || `<tr><td colspan=5 class="muted">មិនទាន់មាន</td></tr>`}</table></div>`; },
  async settings() { const s = await A("settings"); $("#main").innerHTML = `<h1>ការកំណត់</h1><div class="card" style="max-width:640px"><label>ឈ្មោះហាង</label><input id="s1" value="${esc(s.storeName)}"><label>តំណជំនួយ (Telegram)</label><input id="s2" value="${esc(s.supportUrl)}"><label>URL រូបភាព KHQR របស់អ្នក (អោយអតិថិជនស្កេន)</label><input id="s3" value="${esc(s.khqrImageUrl)}" placeholder="https://…/khqr.png"><label>ចំណាំក្នុងទំព័រទូទាត់</label><input id="s4" value="${esc(s.payNote)}"><label>QR ផុតកំណត់ (វិនាទី)</label><input id="s5" type="number" value="${s.qrExpireSec}"><label class="row" style="margin-top:14px"><input id="s6" type="checkbox" style="width:auto" ${s.maintenance ? "checked" : ""}> បិទហាងបណ្តោះអាសន្ន (ថែទាំ)</label><div style="height:14px"></div><button class="btn" onclick="saveSettings()">រក្សាទុក</button></div>`; },
};
function modal(html) { const m = document.createElement("div"); m.className = "modal"; m.innerHTML = `<div>${html}</div>`; m.onclick = e => { if (e.target === m) m.remove(); }; document.body.appendChild(m); return m; }
const close = () => document.querySelector(".modal")?.remove();
function deliverModal(id) { modal(`<h3>ដឹកជញ្ជូន #${id}</h3><label>email:password</label><input id="cr" autofocus><div class="row" style="margin-top:14px"><button class="btn" onclick="act('orders/${id}/deliver',{cred:$('#cr').value})">ផ្ញើទៅអតិថិជន</button></div>`); }
async function act(p, b) { await A(p, "POST", b); close(); toast("រួចរាល់ ✓"); shell(); }
async function refund(id) { if (confirm("សងប្រាក់ទៅកាបូបអតិថិជន?")) act(`orders/${id}/refund`, {}); }
async function payAct(id, a) { if (a === "approve" && !confirm("បានទទួលលុយពិតមែនទេ?")) return; act(`payments/${id}/${a}`, {}); }
function balModal(id) { modal(`<h3>កែសមតុល្យ ${id}</h3><label>បន្ថែម (+) ឬដក (−) ជាដុល្លារ</label><input id="dl" type="number" step="0.01" autofocus><div class="row" style="margin-top:14px"><button class="btn" onclick="act('users/${id}/balance',{delta:$('#dl').value})">រក្សាទុក</button></div>`); }
function stockModal(pid, plan) { modal(`<h3>បន្ថែមស្តុក · ${esc(plan)}</h3><label>មួយបន្ទាត់ក្នុងមួយគណនី</label><textarea id="ln" placeholder="user1@mail.com:pass1&#10;user2@mail.com:pass2"></textarea><div class="row" style="margin-top:14px"><button class="btn" onclick="addStock('${pid}','${esc(plan)}')">បន្ថែម</button></div>`); }
async function addStock(pid, plan) { const r = await A(`stock/${pid}?plan=${encodeURIComponent(plan)}`, "POST", { lines: $("#ln").value }); close(); toast(`បន្ថែម ${r.added} · សរុប ${r.total}`); shell(); }
async function stockView(pid, plan) { const r = await A(`stock/${pid}?plan=${encodeURIComponent(plan)}`); modal(`<h3>${esc(plan)} · ${r.lines.length}</h3><textarea readonly style="min-height:200px">${esc(r.lines.join("\n"))}</textarea><div class="row" style="margin-top:14px"><button class="btn r" onclick="clearStock('${pid}','${esc(plan)}')">សម្អាតទាំងអស់</button></div>`); }
async function clearStock(pid, plan) { if (confirm("លុបស្តុកទាំងអស់?")) { await A(`stock/${pid}?plan=${encodeURIComponent(plan)}`, "DELETE"); close(); shell(); } }
async function delProd(id) { if (confirm("លុបផលិតផលនេះ?")) { await A("products/" + id, "DELETE"); shell(); } }
function prodModal(id) {
  const p = (id && window._ps.find(x => x.id === id)) || { name: "", letter: "", c: ["#7C5CFF", "#3B82F6"], cat: "", tag: "", rating: 4.8, sold: "0", enabled: true, delivery: "auto", feat: [], types: ["Private"], plans: [{ k: "1 ខែ", p: 1 }] };
  modal(`<h3>${id ? "កែ" : "បន្ថែម"} ផលិតផល</h3><div class="grid g2"><div><label>ឈ្មោះ</label><input id="p1" value="${esc(p.name)}"></div><div><label>អក្សរលើឡូហ្គោ (1-2)</label><input id="p2" value="${esc(p.letter)}" maxlength=2></div><div><label>ពណ៌ទី 1</label><input id="p3" value="${p.c[0]}"></div><div><label>ពណ៌ទី 2</label><input id="p4" value="${p.c[1]}"></div><div><label>ចំណាត់ក្រុម</label><input id="p5" value="${esc(p.cat)}"></div><div><label>ដឹកជញ្ជូន</label><select id="p6"><option value="auto" ${p.delivery === "auto" ? "selected" : ""}>ស្វ័យប្រវត្តិ (ពីស្តុក)</option><option value="manual" ${p.delivery === "manual" ? "selected" : ""}>ដោយដៃ (Admin)</option></select></div></div>
  <label>ពិពណ៌នាខ្លី</label><input id="p7" value="${esc(p.tag)}"><label>កញ្ចប់ (មួយបន្ទាត់: ឈ្មោះ | តម្លៃ | ស្លាកសន្សំ)</label><textarea id="p8">${p.plans.map(x => [x.k, x.p, x.save || ""].join(" | ")).join("\n")}</textarea><label>ប្រភេទគណនី (មួយបន្ទាត់)</label><textarea id="p9" style="min-height:60px">${esc(p.types.join("\n"))}</textarea><label>អត្ថប្រយោជន៍ (មួយបន្ទាត់)</label><textarea id="p10" style="min-height:80px">${esc(p.feat.join("\n"))}</textarea>
  <div class="grid g2"><div><label>ពិន្ទុ</label><input id="p11" value="${p.rating}"></div><div><label>លក់បានចំនួន (បង្ហាញ)</label><input id="p12" value="${esc(p.sold)}"></div></div><label class="row"><input id="p13" type="checkbox" style="width:auto" ${p.enabled ? "checked" : ""}> បង្ហាញក្នុងហាង</label><div class="row" style="margin-top:14px"><button class="btn" onclick="saveProd('${id || ""}')">រក្សាទុក</button></div>`);
}
async function saveProd(id) {
  const plans = $("#p8").value.split("\n").map(l => l.split("|").map(s => s.trim())).filter(a => a[0] && a[1]).map(a => ({ k: a[0], p: Number(a[1]), save: a[2] || "" }));
  const b = { name: $("#p1").value, letter: $("#p2").value, c: [$("#p3").value, $("#p4").value], cat: $("#p5").value, delivery: $("#p6").value, tag: $("#p7").value, plans, types: $("#p9").value, feat: $("#p10").value, rating: $("#p11").value, sold: $("#p12").value, enabled: $("#p13").checked };
  await A(id ? "products/" + id : "products", id ? "PUT" : "POST", b); close(); toast("រក្សាទុករួច ✓"); shell();
}
async function saveSettings() { await A("settings", "PUT", { storeName: $("#s1").value, supportUrl: $("#s2").value, khqrImageUrl: $("#s3").value, payNote: $("#s4").value, qrExpireSec: $("#s5").value, maintenance: $("#s6").checked }); toast("រក្សាទុករួច ✓"); }
shell().catch(() => loginView());
setInterval(() => { if ($("#main") && (page === "pay" || page === "dash" || page === "orders") && !document.querySelector(".modal")) shell(); }, 20000);
</script></body></html>
